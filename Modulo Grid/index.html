<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        *{
           margin: 0px;
        }
        .grid-container{
            width: 100%;
            height: 800px;
            background-color: rgb(0, 0, 0);

            display: grid;
            grid-template-areas:
            "header         header          header"
            "nav            nav             nav"
            "contenido1     contenido1      contenido1"
            "contenido2     contenido2      contenido2"
            "contenido3     contenido3      contenido3"
            "aside          aside           aside"
            "footer         footer          footer"
            ;
            gap: 20px;
    
        }
        .item1{
                grid-area: header;
                background-color: burlywood;

            }
        .item2{
                grid-area: nav;
                background-color: rgb(222, 135, 222);
            }
        .item3{
                grid-area: contenido1;
                background-color: rgb(135, 222, 135);
        
            }
        .item4{
                grid-area: contenido2;
                background-color: rgb(135, 135, 222);
        
            }
        .item5{
                grid-area: contenido3;
                background-color: rgb(135, 222, 222);
        
            }
        .item6{
                grid-area: aside;
                background-color: rgb(222, 135, 135);
            }
        .item7{
                grid-area: footer;
                background-color: rgb(222, 222, 135);
            }

        fieldset{
            font-size: 20px;
        }

        .grid-container p{
            font-size: 24px;
            padding: 15px;

        }

        div p{
            font-size: 24px;
            padding: 20px;
        }

        fieldset p{
            font-size: 20px;
        }

        @media screen and (min-width: 720px) {
                .grid-container{
                width: 100%;
                height: 900px;
                background-color: rgb(0, 0, 0);

                display: grid;
                grid-template-areas:
                "header header  header"
                "nav    nav     nav"
                "contenido1   contenido1    aside"
                "contenido2   contenido3    aside"
                "footer footer  footer"
                ;
                gap: 25px;
        
            }
            .item1{
                grid-area: header;
                background-color: burlywood;

            }
            .item2{
                grid-area: nav;
                background-color: rgb(222, 135, 222);
            }
            .item3{
                grid-area: contenido1;
                background-color: rgb(135, 222, 135);
        
            }
            .item4{
                grid-area: contenido2;
                background-color: rgb(135, 135, 222);
        
            }
            .item5{
                grid-area: contenido3;
                background-color: rgb(135, 222, 222);
        
            }
            .item6{
                grid-area: aside;
                background-color: rgb(222, 135, 135);
            }
            .item7{
                grid-area: footer;
                background-color: rgb(222, 222, 135);
            }
        }

    </style>

</head>
<body>

    <fieldset>
        <p>Acceder a...</p>
        <a href="gridcolumn.html">Grid Column</a>
    </fieldset>

    <div>
        <p>Grid Template Areas</p>
    </div>
    <section class="grid-container">
        <div class="grid-item item1"><p>header</p></div>
        <div class="grid-item item2"><p>nav</p></div>
        <div class="grid-item item3"><p>contenido 1</p></div>
        <div class="grid-item item4"><p>contenido 2</p></div>
        <div class="grid-item item5"><p>contenido 3</p></div>
        <div class="grid-item item6"><p>aside</p></div>
        <div class="grid-item item7"><p>footer</p></div>


    </section>


</body>
</html>
