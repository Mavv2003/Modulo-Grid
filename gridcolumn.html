<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>


            *{
                margin: 0px;
            }
            .grid-container{
                width: 100%;
                height: 900px;
                background-color: rgb(0, 0, 0);

                display: grid;
                grid-template-rows: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
                grid-template-columns: 1fr ;
                gap: 20px;
                

            }

            .grid-item{
                background-color: rgb(0, 0, 0);
            }

            .item1{
                grid-row: 1;
                grid-column: 1;
                background-color: burlywood;
            }
            .item2{
                grid-row: 2;
                grid-column: 1;
                background-color: #de87de;
            
            }
            .item3{
                grid-row: 3;
                grid-column: 1;
                background-color: rgb(135, 222, 135);
            }

            .item4{
                grid-row: 4;
                grid-column: 1;
                background-color: rgb(135, 135, 222);
            }

            .item5{
                grid-row: 5;
                grid-column: 1;
                background-color: rgb(135, 222, 222);
            }

            .item6{
                grid-row: 6;
                grid-column: 1;
                background-color: rgb(222, 135, 135);
            }
            
            .item7{
                grid-row: 7;
                grid-column: 1;
                background-color: #dede87;
            }

            fieldset{
                font-size: 20px;
            }

            .grid-container p{
                font-size: 24px;
                padding: 15px;

            }

            div p{
                font-size: 24px;
                padding: 20px;
            }

            fieldset p{
                font-size: 20px;
            }

        @media screen and (min-width: 720px) {

            
            *{
                margin: 0px;
            }
            .grid-container{
                width: 100%;
                height: 900px;
                background-color: rgb(0, 0, 0);

                display: grid;
                grid-template-columns: 1fr 1fr 1fr ;
                grid-template-rows: 1fr 0.25fr 1.5fr 1.25fr 1fr 1fr;
                gap: 20px;
                

            }

            .grid-item{
                background-color: rgb(0, 0, 0);
            }

            .item1{
                grid-column-start: 1;
                grid-column-end: 4;
                background-color: burlywood;
            }
            .item2{
                grid-column-start: 1;
                grid-column-end: 4;
                background-color: #de87de;
            
            }
            .item3{
                grid-column-start: 1;
                grid-column-end: 3;
                background-color: rgb(135, 222, 135);
            }

            .item4{
                grid-column-start: 1;
                grid-column-end: 3;
                background-color: rgb(135, 135, 222);
            }

            .item5{
                grid-column-start: 1;
                grid-column-end: 3;
                background-color: rgb(135, 222, 222);
            }

            .item6{
                grid-row-start: 3;
                grid-row-end: 6;
                grid-column-start: 3;
                grid-column-end: 4;
                background-color: rgb(222, 135, 135);
            }
            
            .item7{
                grid-column-start: 1;
                grid-column-end: 4;
                background-color: #dede87;
            }

            fieldset{
                font-size: 20px;
            }

            .grid-container p{
                font-size: 24px;
                padding: 15px;

            }

            div p{
                font-size: 32px;
                padding: 20px;
            }

            fieldset p{
                font-size: 20px;
            }
        }

    </style>
</head>

<body>

    <fieldset>
        <p>Acceder a...</p>
        <a href="index.html">Grid Column</a>
    </fieldset>

    <div>
        <p>Grid Template Columns - Rows</p>
    </div>

    <section class="grid-container">

        <div class="grid-item item1"><p>header</p></div>
        <div class="grid-item item2"><p>nav</p></div>
        <div class="grid-item item3"><p>contenido 1</p></div>
        <div class="grid-item item4"><p>contenido 2</p></div>
        <div class="grid-item item5"><p>contenido 3</p></div>
        <div class="grid-item item6"><p>aside</p></div>
        <div class="grid-item item7"><p>footer</p></div>

    </section>

    
</body>
</html>
